[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "evora"
version = "0.1.0"
description = "EVORA - Standalone AI Software Development Engine"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "anthropic>=0.40.0",
    "httpx>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
evora = "evora.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evora*"]

[tool.setuptools.package-data]
evora = ["*.yaml", "*.yml"]
